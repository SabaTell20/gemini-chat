# nginx serves the built React site and passes every /api call to the backend,
# so the browser only ever talks to one address.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # several files of up to 20 MB each can come in one message (the backend checks each one)
    client_max_body_size 110m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # pass the answer on word by word instead of waiting for all of it
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # built files have a unique name per version, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # any other address (/Billing, /Terms ...) is handled by React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
